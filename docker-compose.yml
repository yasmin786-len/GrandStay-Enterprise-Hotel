services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - hotel_erp_mongo:/data/db

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/grandstay_hotel_erp
      JWT_SECRET: change-this-in-production
      JWT_EXPIRES_IN: 8h
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:4173
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "4173:80"
    depends_on:
      - api

volumes:
  hotel_erp_mongo:
